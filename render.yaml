services:
  - type: web
    name: eclipse
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ECLIPSE_DATA_DIR
        value: /var/data
      - key: ECLIPSE_SECRET_KEY
        generateValue: true
      - key: ECLIPSE_COOKIE_SECURE
        value: "1"
      - key: ECLIPSE_ADMIN_EMAIL
        sync: false
    disk:
      name: eclipse-data
      mountPath: /var/data
      sizeGB: 1
